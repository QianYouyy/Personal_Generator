# ============================================
# 全局配置文件
# 所有阶段使用的 model 在此统一管理
# ============================================

# --------------------------------------------
# LLM 全局配置
# --------------------------------------------
llm:
  # API 配置
  api_base: null          # 自定义 API base URL（如使用中转）
  api_key: null           # 从环境变量 OPENAI_API_KEY 读取

  # 各阶段专用模型（修改此处即可切换模型）
  # 注意：以下模型必须配置，程序会按名称自动调用
  qgenerator_model: "gpt-5.4"           # Phase 1: 问卷生成器（生成新问卷）
  mutator_model: "gpt-5.4-mini"              # Phase 3: 变异算子（代码改写，需要强模型）
  persona_model: "gpt-4o-mini"         # Phase 2: 人格生成器（Stage1/Stage2）
  simulator_model: "gpt-4o-mini"       # Phase 2: Concordia 模拟器（Agent 回答）

# --------------------------------------------
# Phase 1: 问卷生成器配置
# --------------------------------------------
qgenerator:
  num_questionnaires: 50
  train_split: 30
  val_split: 10
  test_split: 10
  few_shot_examples:
    - "BFI"
    - "DASS"
    - "SVO"
    - "NFCS"
  k_dimensions: [2, 3]
  likert_scale: 5
  items_per_dimension: 5
  stage1_temperature: 0.8
  stage2_temperature: 0.7

# --------------------------------------------
# Phase 2: 人格生成器配置
# --------------------------------------------
persona_generator:
  default_n: 25
  seeds:
    - seed1
    - seed2
    - seed3
  stage1_temperature: 0.9
  stage2_temperature: 0.8

# --------------------------------------------
# Phase 2: Concordia 模拟器配置
# --------------------------------------------
simulator:
  reset_memory_per_question: true
  logic: "appropriateness"
  max_attempts_per_question: 3
  max_workers: 10          # 并行线程数（模拟回答时的并发数）

# --------------------------------------------
# Phase 2: 多样性评估器配置
# --------------------------------------------
evaluator:
  num_random_points: 10000
  coverage_calibration_trials: 1000
  coverage_target: 0.99
  metrics:
    - coverage
    - convex_hull
    - avg_dist
    - min_dist
    - dispersion
    - kl_divergence

# --------------------------------------------
# Phase 3: Open-Evolve 进化引擎配置
# --------------------------------------------
open_evolve:
  num_islands: 6
  elites_per_island: 6
  extinction_interval: 5          # 轮数触发灭绝（每5轮触发一次）
  extinction_interval_hours: 8    # 小时触发灭绝
  initial_seed_distribution:
    seed1: 2
    seed2: 2
    seed3: 2
  max_evaluations_per_candidate: 40    # 评估时使用的问卷数量
  personas_per_evaluation: 10          # 每份问卷生成的人格数量（测试阶段建议5-15，正式25）
