# MegaPersona-Evolve configuration

llm:
  api_base: null
  api_key: null
  timeout_seconds: 180

  # MegaPersona generation and evaluation models.
  mutator_model: "gpt-5.4-mini"
  persona_model: "gpt-4o-mini"
  simulator_model: "gpt-4o-mini"

  providers:
    openai:
      api_base: null
      api_key_env: "OPENAI_API_KEY"
      timeout_seconds: 180
      # Stage-specific models: mutator / persona generator / shadow simulator
      mutator_model: "gpt-5.4-mini"
      persona_model: "gpt-4o-mini"
      simulator_model: "gpt-4o-mini"
    deepseek:
      api_base: "https://api.deepseek.com"
      api_key_env: "DEEPSEEK_API_KEY"
      timeout_seconds: 180
      # Stage-specific models used when --llm-provider deepseek is enabled
      mutator_model: "deepseek-v4-pro"
      persona_model: "deepseek-v4-flash"
      simulator_model: "deepseek-v4-flash"

evaluator:
  num_random_points: 10000
  coverage_calibration_trials: 1000
  coverage_target: 0.99
  metrics:
    - coverage
    - convex_hull
    - avg_dist
    - min_dist
    - dispersion
    - kl_divergence

open_evolve:
  num_islands: 6
  elites_per_island: 6
  extinction_interval: 5
  extinction_interval_hours: 8
  initial_seed_distribution:
    seed: 6

mega_persona:
  # Generation architecture. Use five_agent and single_call as experimental
  # conditions rather than treating one as inherently formal.
  persona_pipeline: "five_agent"
  shadow_simulator_backend: "llm"
  default_n: 25
  default_seeds:
    - 17
    - 23
    - 31
  shadow_surveys: 12
  validation_shadow_surveys: 4
  test_shadow_surveys: 4
  items_per_shadow_survey: 12
  coverage_radius: 0.28
  duplicate_threshold: 0.82
  shadow_max_workers: 1
